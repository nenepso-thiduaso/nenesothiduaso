databases:
  - name: nenepso-db
    plan: free
    databaseName: nenepdb
    user: nenepapp

services:
  - type: web
    name: nenepso-web
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nenepso-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
